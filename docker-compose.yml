# =============================================================================
# P2P testbed topology. GENERATED by p2prunner/compose.py; edit that, not this.
#
#   [peer-a]--lan_a--[nat-a]--+------------------ wan ------------------+--[nat-b]--lan_b--[peer-b]
#                             |                                         |
#                             +--carrier_a--[cgn-a]--wan    wan--[cgn-b]--carrier_b--+
#
# Each peer is a household: a computer behind its home router, optionally
# behind its ISP's carrier-grade NAT. wan (198.18.0.0/15) is the simulated
# public internet, where the services (STUN, rendezvous, relay; attackers
# later) live. Addresses: see p2prunner/topology.py.
#
# A home router wired to both the wan and its carrier network uses the one
# its UPSTREAM setting picks and switches the other off:
#   UPSTREAM=wan   -> the home router has a public IP (normal home internet)
#   UPSTREAM=cgnat -> the home router sits behind the ISP's CGN (two NAT layers)
#
# Pick a configuration with environment variables (see .env.example), e.g.
#   NAT_A_TYPE=symmetric NET_PROFILE=coast docker compose up -d --build --wait
# Per-peer link settings (NET_PROFILE_A, UPLINK_MBIT_B, ...) override the
# global ones (NET_PROFILE, UPLINK_MBIT, DOWNLINK_MBIT).
# =============================================================================

# --- Shared settings (YAML anchors, merged into services below) ---
x-router: &router
  build: ./testbed/router
  image: p2p-testbed/router
  init: true                      # tini as PID 1, so containers stop instantly
  cap_add: [NET_ADMIN]            # needed for iptables, routes and tc
  sysctls:
    net.ipv4.ip_forward: 1        # act as a router
    net.ipv4.conf.all.rp_filter: 0      # don't drop packets on "unexpected" interfaces
    net.ipv4.conf.default.rp_filter: 0
    # How long an idle UDP mapping (pinhole) stays open. Real routers vary
    # (roughly 30-180 s); this matters for when old hop ports close.
    net.netfilter.nf_conntrack_udp_timeout: ${UDP_TIMEOUT:-30}
    net.netfilter.nf_conntrack_udp_timeout_stream: ${UDP_TIMEOUT_STREAM:-120}
  healthcheck:                    # healthy once configure-router.sh finishes
    test: ["CMD", "test", "-f", "/tmp/ready"]
    interval: 1s
    retries: 30

x-host: &host
  # Built from the repository root so the Go tools in p2p/ can be
  # compiled into the image (see testbed/host/Dockerfile and .dockerignore).
  build: { context: ., dockerfile: testbed/host/Dockerfile }
  image: p2p-testbed/host
  init: true
  cap_add: [NET_ADMIN]            # needed to replace the default route
  healthcheck:
    test: ["CMD", "test", "-f", "/tmp/ready"]
    interval: 1s
    retries: 30

services:
  # ---------------------------------------------------------------------------
  # Peer a (with a CGN it may sit behind)
  # ---------------------------------------------------------------------------
  peer-a:
    <<: *host
    environment:
      GATEWAY: 10.200.1.2                   # nat-a's LAN address
    # Static Noise keys, made with: docker compose exec peer-a punch -genkey /keys/a
    volumes: ["./keys:/keys"]
    networks:
      lan_a: { ipv4_address: 10.200.1.10 }
    depends_on:
      nat-a: { condition: service_healthy }

  nat-a:
    <<: *router
    environment:
      ROLE: home
      NAT_TYPE: ${NAT_A_TYPE:-port_restricted}
      UPSTREAM: ${NAT_A_UPSTREAM:-wan}
      LAN_IP: 10.200.1.2
      LAN_SUBNET: 10.200.1.0/24
      INSIDE_HOST: 10.200.1.10                 # peer-a
      WAN_IP: 198.18.1.10                    # public IP when UPSTREAM=wan
      CARRIER_IP: 10.201.1.10                # carrier IP when UPSTREAM=cgnat
      CGN_IP: 10.201.1.2                     # cgn-a, next hop when UPSTREAM=cgnat
      NET_PROFILE: ${NET_PROFILE_A:-}
      DEFAULT_NET_PROFILE: ${NET_PROFILE:-local}
      UPLINK_MBIT: ${UPLINK_MBIT_A:-}
      DEFAULT_UPLINK_MBIT: ${UPLINK_MBIT:-}
      DOWNLINK_MBIT: ${DOWNLINK_MBIT_A:-}
      DEFAULT_DOWNLINK_MBIT: ${DOWNLINK_MBIT:-}
      DEBUG: ${DEBUG:-0}
    networks:
      lan_a: { ipv4_address: 10.200.1.2 }
      carrier_a: { ipv4_address: 10.201.1.10 }
      wan: { ipv4_address: 198.18.1.10 }
    depends_on:
      cgn-a: { condition: service_healthy }

  cgn-a:
    <<: *router
    environment:
      ROLE: cgn
      NAT_TYPE: ${CGN_A_TYPE:-port_restricted}
      INSIDE_IP: 10.201.1.2
      INSIDE_SUBNET: 10.201.1.0/24
      INSIDE_HOST: 10.201.1.10                # nat-a's carrier address
      OUTSIDE_IP: 198.18.1.11                # peer a's public IP when behind CGNAT
      DEBUG: ${DEBUG:-0}
    networks:
      carrier_a: { ipv4_address: 10.201.1.2 }
      wan:       { ipv4_address: 198.18.1.11 }

  # ---------------------------------------------------------------------------
  # Peer b (with a CGN it may sit behind)
  # ---------------------------------------------------------------------------
  peer-b:
    <<: *host
    environment:
      GATEWAY: 10.200.2.2                   # nat-b's LAN address
    # Static Noise keys, made with: docker compose exec peer-b punch -genkey /keys/b
    volumes: ["./keys:/keys"]
    networks:
      lan_b: { ipv4_address: 10.200.2.10 }
    depends_on:
      nat-b: { condition: service_healthy }

  nat-b:
    <<: *router
    environment:
      ROLE: home
      NAT_TYPE: ${NAT_B_TYPE:-port_restricted}
      UPSTREAM: ${NAT_B_UPSTREAM:-wan}
      LAN_IP: 10.200.2.2
      LAN_SUBNET: 10.200.2.0/24
      INSIDE_HOST: 10.200.2.10                 # peer-b
      WAN_IP: 198.18.2.10                    # public IP when UPSTREAM=wan
      CARRIER_IP: 10.201.2.10                # carrier IP when UPSTREAM=cgnat
      CGN_IP: 10.201.2.2                     # cgn-b, next hop when UPSTREAM=cgnat
      NET_PROFILE: ${NET_PROFILE_B:-}
      DEFAULT_NET_PROFILE: ${NET_PROFILE:-local}
      UPLINK_MBIT: ${UPLINK_MBIT_B:-}
      DEFAULT_UPLINK_MBIT: ${UPLINK_MBIT:-}
      DOWNLINK_MBIT: ${DOWNLINK_MBIT_B:-}
      DEFAULT_DOWNLINK_MBIT: ${DOWNLINK_MBIT:-}
      DEBUG: ${DEBUG:-0}
    networks:
      lan_b: { ipv4_address: 10.200.2.2 }
      carrier_b: { ipv4_address: 10.201.2.10 }
      wan: { ipv4_address: 198.18.2.10 }
    depends_on:
      cgn-b: { condition: service_healthy }

  cgn-b:
    <<: *router
    environment:
      ROLE: cgn
      NAT_TYPE: ${CGN_B_TYPE:-port_restricted}
      INSIDE_IP: 10.201.2.2
      INSIDE_SUBNET: 10.201.2.0/24
      INSIDE_HOST: 10.201.2.10                # nat-b's carrier address
      OUTSIDE_IP: 198.18.2.11                # peer b's public IP when behind CGNAT
      DEBUG: ${DEBUG:-0}
    networks:
      carrier_b: { ipv4_address: 10.201.2.2 }
      wan:       { ipv4_address: 198.18.2.11 }

  # ---------------------------------------------------------------------------
  # WAN services
  # ---------------------------------------------------------------------------
  # stun: coturn in STUN-only mode. Answers "what is my public address?" on
  # UDP 3478 and supports the RFC 5780 NAT behaviour tests, which need a
  # second IP (198.18.0.103, added by start-stun.sh) and a second port (3479).
  stun:
    build: ./testbed/stun
    image: p2p-testbed/stun
    init: true
    cap_add: [NET_ADMIN]            # needed to add the second IP address
    environment:
      PRIMARY_IP: 198.18.0.100
      ALT_IP: 198.18.0.103
    networks:
      wan: { ipv4_address: 198.18.0.100 }
    healthcheck:                    # healthy once it answers a real STUN request
      # timeout: the client can wait on RFC 5780 replies; cap each check.
      test: ["CMD", "timeout", "3", "turnutils_stunclient", "198.18.0.100"]
      interval: 1s
      timeout: 5s
      retries: 30

  # rendezvous: introduces the members of each room to each other
  # (p2p/cmd/rendezvous). It only sees each peer's public address and never
  # relays peer traffic. Uses the host image, which contains the binary.
  rendezvous:
    <<: *host
    networks:
      wan: { ipv4_address: 198.18.0.101 }
    command: ["rendezvous", "-listen", ":7000"]

  # relay: coturn as a TURN relay (RFC 8656), user testbed / password
  # testbed. Peers in relayed mode (punch -relay) each allocate a relayed
  # address here and send only to each other's, so neither learns the
  # other's IP; their traffic stays Noise-encrypted end to end. A separate
  # container from stun, so relay load never affects STUN results.
  # RELAY_DELAY_MS delays what the relay sends (a relay out of the way:
  # 2 x RELAY_DELAY_MS more round trip than the direct path).
  relay:
    build: ./testbed/stun           # the same coturn image as stun, in its relay role
    image: p2p-testbed/stun
    init: true
    cap_add: [NET_ADMIN]            # needed for the optional delay (tc netem)
    environment:
      RELAY_IP: 198.18.0.102
      RELAY_DELAY_MS: ${RELAY_DELAY_MS:-0}
    networks:
      wan: { ipv4_address: 198.18.0.102 }
    command: ["start-relay.sh"]
    healthcheck:                    # healthy once it answers a STUN request (no login needed)
      test: ["CMD", "timeout", "3", "turnutils_stunclient", "198.18.0.102"]
      interval: 1s
      timeout: 5s
      retries: 30

  # Reserved WAN addresses:
  #   198.18.0.103  STUN alternate IP (not visible to Docker, so keep it free)
  #   198.18.0.200+ attacker containers

# =============================================================================
# Networks. Fixed subnets so every address above is predictable.
#
# gateway_mode_ipv4 = nat-unprotected: since Docker 28, the host drops any
# packet addressed to a container's IP that arrives from a different Docker
# network. Our routers do exactly that on purpose (peer-a -> nat-a -> stun),
# so we turn that protection off for these networks. Isolation is enforced
# by our own NAT routers instead. Docker versions before 28 never had the
# protection and don't need this option.
#
# enable_ip_masquerade = false: Docker normally adds a host rule that
# masquerades each network's subnet when its traffic leaves through another
# bridge. Our routers forward exactly such traffic (a peer's public WAN
# address arriving on a LAN after a cone NAT lets it in), and the host rule
# would rewrite its source to the LAN bridge's gateway. The testbed never
# needs the host to NAT anything to the real internet.
# =============================================================================
x-net-opts: &net_opts
  com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected
  com.docker.network.bridge.enable_ip_masquerade: "false"

networks:
  lan_a:
    driver_opts: *net_opts
    ipam: { config: [ { subnet: 10.200.1.0/24, gateway: 10.200.1.1 } ] }
  carrier_a:                                 # the ISP's network between home router and CGN
    driver_opts: *net_opts
    ipam: { config: [ { subnet: 10.201.1.0/24, gateway: 10.201.1.1 } ] }
  lan_b:
    driver_opts: *net_opts
    ipam: { config: [ { subnet: 10.200.2.0/24, gateway: 10.200.2.1 } ] }
  carrier_b:                                 # the ISP's network between home router and CGN
    driver_opts: *net_opts
    ipam: { config: [ { subnet: 10.201.2.0/24, gateway: 10.201.2.1 } ] }
  wan:                                       # the "public internet" (RFC 2544 benchmark range)
    driver_opts: *net_opts
    ipam: { config: [ { subnet: 198.18.0.0/15, gateway: 198.18.0.1 } ] }
