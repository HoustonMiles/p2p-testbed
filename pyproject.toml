# Python side of the testbed: the experiment runner and the analysis notebook.
#
#   uv run python -m p2prunner --help                 # the runner (standard library only)
#   uv run --group analysis jupyter lab               # the analysis notebook
#
# This is an application, not a library, so uv doesn't need to build or
# install it as a package (package = false below).

[project]
name = "p2p-testbed"
version = "0.1.0"
description = "Experiment runner and analysis for the port-hopping vs. relay P2P testbed"
requires-python = ">=3.11"   # tomllib (TOML parsing) is in the standard library from 3.11
dependencies = []            # the runner itself needs nothing beyond the standard library

[dependency-groups]
# Only needed for analysis/results.ipynb.
analysis = [
    "pandas>=2.2",
    "matplotlib>=3.9",
    "jupyterlab>=4.2",
]
# Linting: uv run --group dev ruff check p2prunner tests
dev = [
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pyflakes (F), pycodestyle (E/W), isort (I), pyupgrade (UP), bugbear (B), comprehensions (C4).
select = ["E", "F", "W", "I", "UP", "B", "C4"]
# B905: zip(strict=) is a style choice; the testbed zips equal-length lists on purpose.
ignore = ["B905"]
