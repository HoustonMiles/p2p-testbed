# =============================================================================
# coturn configuration for the testbed's STUN server.
#
# STUN only: answers "what is my public address?" and runs the RFC 5780
# NAT behaviour tests. The TURN relay will be a SEPARATE coturn container in
# a later step, so relay load never affects STUN results.
#
# The two listening IPs are passed on the command line by start-stun.sh.
# Having two IPs plus an alternate port is what turns on RFC 5780: the
# server can answer from a different IP and/or port when a client asks
# (CHANGE-REQUEST), which is how the NAT's filtering behaviour is probed.
#
# (coturn needs each comment on its own line, not after a setting.)
# =============================================================================

# Ignore all TURN (relay) requests.
stun-only

# Standard STUN port, plus the second port used for RFC 5780 tests.
listening-port=3478
alt-listening-port=3479

# No admin interface, no TLS/DTLS: plain STUN over UDP and TCP.
no-cli
no-tls
no-dtls

# Don't advertise the coturn version in responses.
no-software-attribute

# Logs go to `docker compose logs stun`.
log-file=stdout
simple-log
