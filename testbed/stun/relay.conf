# =============================================================================
# coturn configuration for the testbed's TURN relay (RFC 8656).
#
# A separate container from the STUN server, so relay load never affects
# STUN results. The relay only forwards UDP: the peers' traffic stays
# Noise-encrypted end to end, so it never sees what they send. Each peer
# allocates a relayed address here and sends only to the other peers'
# relayed addresses, so no peer learns another's real IP.
#
# The listening and relay IP are passed on the command line by
# start-relay.sh. (coturn needs each comment on its own line.)
# =============================================================================

listening-port=3478

# Long-term credentials: one fixed user for the whole testbed (not a secret;
# the testbed never touches a real network). punch -relay uses them by default.
lt-cred-mech
user=testbed:testbed
realm=p2p-testbed

# Relayed addresses get their ports from this range.
min-port=49152
max-port=65535

# UDP relaying only; no admin interface, no TLS/DTLS.
no-tcp-relay
no-cli
no-tls
no-dtls

# Don't advertise the coturn version in responses.
no-software-attribute

# Logs go to `docker compose logs relay`.
log-file=stdout
simple-log
