# =============================================================================
# Hole-punching matrix: for which NAT pairings does direct UDP hole punching
# work, and how long does it take?
#
# Runs the raw UDP baseline (baseline/, `punch` on both peers: STUN,
# rendezvous, hole punching; no Noise, no port-hopping) for all 16
# home-router pairings, with side B on the public internet, behind a
# port-restricted CGN, and behind a symmetric CGN.
#
# Each row records `punched` (both sides got through) next to
# `expected_punched`, the theory for these NAT types: punching fails exactly
# when one side's mapping and the other side's filtering are both
# address-and-port-dependent (see punch_expected in p2prunner/trials.py):
#
#                     B: full_cone  restricted  port_restr.  symmetric
#   A: full_cone           yes         yes         yes          yes
#      restricted          yes         yes         yes          yes
#      port_restricted     yes         yes         yes          no
#      symmetric           yes         yes         no           no
#
# Behind a CGN, each side behaves like the stricter of its two NATs. The
# pairings that fail here are the ones that must fall back to the relay.
#
#   uv run python -m p2prunner plan experiments/holepunch_matrix.toml
#   uv run python -m p2prunner run  experiments/holepunch_matrix.toml
# =============================================================================

name = "holepunch_matrix"
description = "Raw UDP hole-punching success and time for every NAT pairing, with and without CGNAT on side B."
trial = "punch"
runs = 5
block_size = 5
seed = 1
verify_nat = true    # RFC 5780 check each time a configuration starts

[params]
timeout_s = 40
est_trial_s = 6      # for `plan` only; a failed punch waits out -punch-timeout
# Punching only, plus a few pings to prove the punched path carries traffic.
args = "-pings 10 -ping-interval 20ms -rate-mbit 0 -punch-timeout 10s"

[matrix]
nat_a = ["full_cone", "restricted", "port_restricted", "symmetric"]
nat_b = ["full_cone", "restricted", "port_restricted", "symmetric"]
# Loss-free, so a failure means the NATs blocked it, not a lost packet.
net_profile = ["local"]

[[matrix.side_b]]
name = "wan"
upstream_b = "wan"

[[matrix.side_b]]
name = "cgnat_port_restricted"
upstream_b = "cgnat"
cgn_b = "port_restricted"

[[matrix.side_b]]
name = "cgnat_symmetric"
upstream_b = "cgnat"
cgn_b = "symmetric"
