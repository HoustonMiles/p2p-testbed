# =============================================================================
# Example of the "command" trial type: the hook for your own programs.
#
# Use this as the template once the Go client exists. The runner starts
# cmd_a on peer-a and cmd_b on peer-b at the same time. Each must print ONE
# JSON object on its last line; its keys become result columns, prefixed
# with a_ and b_. Placeholders: $seed, $trial, and any other [params] name.
#
# This placeholder version only reports each peer's public address, using
# the STUN client already installed on the peers, so you can test the hook.
#
#   uv run python -m p2prunner run experiments/example_command.toml
# =============================================================================

name = "example_command"
description = "Template for the command hook; reports each peer's public address."
trial = "command"
runs = 3
block_size = 3
seed = 1
verify_nat = false

[params]
timeout_s = 20
# Later, something like:
#   cmd_a = "p2p-client --role a --seed $seed --hop-interval-ms $hop_interval_ms"
#   hop_interval_ms = 500
cmd_a = '''timeout 3 turnutils_stunclient 203.0.113.100 2>/dev/null | sed -n 's/.*reflexive addr: *\([0-9.:]*\).*/{"public": "\1", "seed": $seed}/p' | head -1'''
cmd_b = '''timeout 3 turnutils_stunclient 203.0.113.100 2>/dev/null | sed -n 's/.*reflexive addr: *\([0-9.:]*\).*/{"public": "\1", "seed": $seed}/p' | head -1'''

[matrix]
net_profile = ["local"]
