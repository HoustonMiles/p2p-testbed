# =============================================================================
# Handoff break: how fast does a hopping link move to the relay?
#
# Two peers in handoff mode, the realistic pairing (port-restricted on both
# sides), so the link hops. Three seconds in, peer a's NAT starts dropping
# everything but its traffic with the servers (break_at_s, see
# p2prunner/breaks.py): hopping dies, the relay still works. The side that
# misses pivot_after hops in a row moves the link to the relay; the other
# follows as soon as that side's traffic comes through the relay. 200 pings
# at 50 ms run across the break; the ones lost show the outage.
#
# Per trial: pairs_pivoted (should equal pairs_to_pivot, 1), pivot_ms_p50
# (from the break until the second side moved), pivot_lost_pings_p50.
# Per link end (links.jsonl): pivoted, pivot_ms, pivot_reason (missed or
# member), pings_recv. Expected: about pivot_after slots plus the overlap
# (1 s slots: ~1.5 s after 1 miss, ~3.5 s after 3).
#
#   uv run python -m p2prunner run  experiments/handoff_break.toml
#   uv run python -m p2prunner mesh results/handoff_break/<the run's folder>
# =============================================================================

name = "handoff_break"
description = "Handoff mode: hopping broken mid-run on one side; time to move to the relay, 3 distances, after 1 or 3 missed hops."
trial = "mesh"
runs = 10
block_size = 5
seed = 1
verify_nat = true

[params]
timeout_s = 60
est_trial_s = 14
pivot_after = 3
break_at_s = 3
break_peers = "a"
args = "-handoff -direct -hop-interval 1s -pivot-after $pivot_after -pings 200 -ping-interval 50ms -rate-mbit 0"

[matrix]
nat_a = ["port_restricted"]
nat_b = ["port_restricted"]
net_profile = ["local", "coast", "transatlantic"]
pivot_after = [1, 3]
